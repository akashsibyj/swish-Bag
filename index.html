<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d0d0d2" />
    <meta name="description" content="Swish loading animation" />
    <!-- No favicon: an empty data URL stops the browser requesting /favicon.ico (no 404). -->
    <link rel="icon" href="data:," />
    <title>Swish Loader</title>
    <!--
      Everything needed for the first paint is in this file: no stylesheet or script blocks it.
      On a slow connection the poster below (the empty scale, the standby LED and the quote) shows
      as soon as this page arrives, while the app downloads; it hands over to the animated loader,
      which starts from exactly this picture.
    -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #d0d0d2; -webkit-text-size-adjust: 100%; }
      body { overflow-x: hidden; }
      #root { min-height: 100vh; min-height: 100dvh; }

      /* Shown only if the app fails to load. */
      .page-message {
        min-height: 100vh; min-height: 100dvh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; padding: 24px; background: #d0d0d2; color: #2d2f31;
        font: 500 16px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
      }
      .page-message p { margin: 0; }
      .page-message__button, .sp-retry button {
        min-height: 44px; padding: 0 18px; border: 1px solid #8f9399; border-radius: 10px;
        background: #f4f4f4; color: #1a1c1b; font: 600 15px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
        cursor: pointer;
      }

      /* ---- Instant poster. Mirrors SwishLoader's layout (SwishLoader.css); keep the two in step. ---- */
      #swish-poster {
        --sp-h: clamp(190px, 44vmin, 360px); /* replaced by the script below (same formula as the loader) */
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        overflow: hidden; isolation: isolate; background: #d0d0d2;
        user-select: none; -webkit-user-select: none; transition: opacity 200ms ease;
      }
      #swish-poster.is-gone { opacity: 0; pointer-events: none; }
      #swish-poster::after {
        content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
        background: radial-gradient(
          calc(var(--sp-h) * 1.7) calc(var(--sp-h) * 1.35) at 50% 50%,
          rgba(208, 208, 210, 0) 36%, rgba(208, 208, 210, 0.55) 60%,
          rgba(208, 208, 210, 0.9) 78%, #d0d0d2 92%
        );
      }
      .sp-frame { position: relative; flex: none; height: var(--sp-h); width: calc(var(--sp-h) * 470 / 510); }
      .sp-stage {
        position: absolute; left: calc(-206 / 470 * 100%); top: calc(-180 / 510 * 100%);
        width: calc(880 / 470 * 100%); height: calc(720 / 510 * 100%); pointer-events: none;
        opacity: 0; transition: opacity 250ms ease; /* fades in once the scale image has arrived */
      }
      #swish-poster.sp-ready .sp-stage { opacity: 1; }
      .sp-stage img, .sp-stage svg { position: absolute; display: block; max-width: none; }
      .sp-backdrop { left: -100%; top: -100%; width: 300%; height: 300%; }
      .sp-plate, .sp-stage svg { left: 0; top: 0; width: 100%; height: 100%; }
      .sp-quote {
        position: relative; z-index: 1; flex: none; width: 100%; max-width: 100%; padding: 0 16px;
        overflow-wrap: break-word; margin: calc(var(--sp-h) * 0.07) 0 0;
        font: 500 14px / 1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: clamp(12px, calc(var(--sp-h) * 0.046), 17px); letter-spacing: 0.01em;
        color: rgba(17, 17, 17, 0.72); text-align: center; text-wrap: balance;
        animation: sp-quote-in 600ms ease 200ms both;
      }
      @keyframes sp-quote-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      .sp-retry { position: relative; z-index: 1; margin-top: 14px; text-align: center; font: 500 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #2d2f31; }
      .sp-retry[hidden] { display: none; }
      .sp-retry p { margin: 0 0 8px; }
      .sp-sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @media (prefers-reduced-motion: reduce) { .sp-quote { animation: none; } #swish-poster, .sp-stage { transition: none; } }
      @media (forced-colors: active) { .sp-quote { color: CanvasText; } }
    </style>
  </head>

    <script>
      // Size the poster exactly like the loader (frameHeightFor in footage.js) before the first
      // paint, hand over when the loader starts, and offer a reload if the app never arrives.
      (function () {
        var el = document.getElementById('swish-poster');
        if (!el) return;
        var done = false;
        var shownRetry = false;
        var watch = 0;
        function size() {
          try {
            var w = el.clientWidth || window.innerWidth;
            var h = el.clientHeight || window.innerHeight;
            if (!(w > 0 && h > 0)) return;
            var s = Math.min(Math.max(190, 0.44 * Math.min(w, h)), 360, 0.72 * h, (0.84 * w * 510) / 470);
            el.style.setProperty('--sp-h', Math.max(80, Math.round(s * 10) / 10) + 'px');
          } catch (e) {}
        }
        function showRetry() {
          if (done || shownRetry) return;
          shownRetry = true;
          try {
            var r = document.getElementById('swish-poster-retry');
            if (r) r.hidden = false;
          } catch (e) {}
        }
        function arm(ms) {
          clearTimeout(watch);
          watch = setTimeout(function () {
            // Only count time the page is actually visible (background tabs load lazily).
            if (document.visibilityState === 'hidden') arm(5000);
            else showRetry();
          }, ms);
        }
        function hide() {
          if (done) return;
          done = true;
          clearTimeout(watch);
          try {
            el.classList.add('is-gone');
            el.removeAttribute('role');
            el.setAttribute('aria-hidden', 'true');
            window.removeEventListener('resize', size);
            setTimeout(function () {
              if (el.parentNode) el.parentNode.removeChild(el);
            }, 400);
          } catch (e) {
            if (el.parentNode) el.parentNode.removeChild(el);
          }
        }
        size();
        window.addEventListener('resize', size);
        try {
          var plate = el.querySelector('.sp-plate');
          if (plate && plate.complete && plate.naturalWidth) el.classList.add('sp-ready');
        } catch (e) {}
        arm(30000);
        // The app's own script failing to download: offer a reload straight away.
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            if (t && t.tagName === 'SCRIPT' && t.src) showRetry();
          },
          true
        );
        window.__swishPoster = { hide: hide, fail: showRetry };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
